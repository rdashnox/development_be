name: Deploy and Verify

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbims-deployment-main
  cancel-in-progress: true

env:
  DENO_VERSION: "2.9.5"

  DENO_ORG: "imperionite"
  DENO_APP: "sbims"
  DENO_HEALTH_URL: "https://sbims.imperionite.deno.net/api/v1/health"

jobs:

  # ============================================================
  # QUALITY VERIFICATION
  # ============================================================
  quality:
    name: SBIMS Pre-Deployment Quality Verification
    uses: ./.github/workflows/_quality-module.yml
    with:
      module: deployment-verification
    secrets: inherit

  # ============================================================
  # DEPLOY TO DENO DEPLOY
  # ============================================================

  deploy-deno:
    name: Deploy SBIMS to Deno Deploy
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      status: ${{ steps.deno-step.outputs.status }}
      time: ${{ steps.deno-step.outputs.time }}
      health: ${{ steps.health-step.outputs.health }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Setup Deno
      # --------------------------------------------------------

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # --------------------------------------------------------
      # Verify Deno CLI
      # --------------------------------------------------------

      - name: Verify Deno CLI
        run: |
          deno --version
          deno deploy --help

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - id: deno-step
        name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          START=$(date +%s)

          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::DENO_DEPLOY_TOKEN GitHub secret is missing."
            exit 1
          fi

          echo "Deploying ${DENO_APP} to Deno Deploy..."
          echo "Organization: ${DENO_ORG}"
          echo "Application: ${DENO_APP}"

          deno deploy \
            --org "${DENO_ORG}" \
            --app "${DENO_APP}" \
            --prod

          END=$(date +%s)
          DURATION=$((END - START))

          echo "status=succeeded" >> "$GITHUB_OUTPUT"
          echo "time=${DURATION}s" >> "$GITHUB_OUTPUT"

          echo "Deno Deploy completed successfully in ${DURATION}s."

      # --------------------------------------------------------
      # Verify Deployment Health
      # --------------------------------------------------------

      - id: health-step
        name: Verify Deno Deployment Health
        run: |
          MAX_ATTEMPTS=12
          ATTEMPT=1

          echo "Checking Deno deployment health..."
          echo "Health URL: ${DENO_HEALTH_URL}"

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            STATUS=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              "$DENO_HEALTH_URL")

            echo "Health check attempt ${ATTEMPT}/${MAX_ATTEMPTS}: HTTP ${STATUS}"

            if [ "$STATUS" = "200" ]; then
              echo "health=PASS" >> "$GITHUB_OUTPUT"
              echo "Deno deployment health check passed."
              exit 0
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "health=FAIL" >> "$GITHUB_OUTPUT"
              echo "::error::Deno deployment health check failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            sleep 5

          done

  # ============================================================
  # DEPLOYMENT REPORT
  # ============================================================

  report:
    name: SBIMS Deployment Report
    needs:
      - deploy-deno
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Deployment Report
        env:
          DENO_RESULT: ${{ needs.deploy-deno.result }}
          DENO_TIME: ${{ needs.deploy-deno.outputs.time }}
          DENO_HEALTH: ${{ needs.deploy-deno.outputs.health }}
        run: |
          echo ""
          echo "======================================================================"
          echo "                    SBIMS DEPLOYMENT REPORT"
          echo "======================================================================"

          echo "Repository   : ${GITHUB_REPOSITORY}"
          echo "Branch       : ${GITHUB_REF_NAME}"
          echo "Commit       : ${GITHUB_SHA}"
          echo "Actor        : ${GITHUB_ACTOR}"
          echo "Run ID       : ${GITHUB_RUN_ID}"

          echo ""
          echo "----------------------------------------------------------------------"
          echo " TARGET: DENO DEPLOY"
          echo "----------------------------------------------------------------------"

          echo "Organization : ${DENO_ORG}"
          echo "Application  : ${DENO_APP}"
          echo "Status       : $([ "$DENO_RESULT" = "success" ] && echo "SUCCESS" || echo "FAILED")"
          echo "Deploy Time  : ${DENO_TIME:-N/A}"
          echo "Health URL   : ${DENO_HEALTH_URL}"
          echo "Health Check : ${DENO_HEALTH:-FAILED}"

          echo ""
          echo "----------------------------------------------------------------------"
          echo " TARGET: CLOUDFLARE WORKERS"
          echo "----------------------------------------------------------------------"

          echo "Deployment   : Managed by Cloudflare GitHub Integration"
          echo "Repository   : ${GITHUB_REPOSITORY}"
          echo "Branch       : ${GITHUB_REF_NAME}"
          echo "Deployment   : NOT MANAGED BY THIS WORKFLOW"

          echo ""
          echo "======================================================================"

          if [ "$DENO_RESULT" = "success" ]; then
            echo " STATUS : PASS - Deno deployment and health check succeeded."
          else
            echo " STATUS : FAIL - Deno deployment or health check failed."
            exit 1
          fi
